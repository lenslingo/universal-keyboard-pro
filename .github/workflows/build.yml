name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-and-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: C# core tests
        run: dotnet run --project windows/tests/UKPro.Core.Tests -c Release
      - name: Kotlin core tests
        working-directory: android
        run: ./gradlew :core:test --no-daemon
      - name: Kotlin ↔ C# interop over TLS WebSocket
        run: |
          export LC_ALL=C.UTF-8
          dotnet build windows/tests/UKPro.Core.Tests -c Release
          dotnet run --no-build -c Release --project windows/tests/UKPro.Core.Tests -- --interop-hub "$PWD/uri.txt" &
          for i in $(seq 1 100); do [ -s uri.txt ] && break; sleep 0.1; done
          (cd android && ./gradlew :core:interop -PuriFile="$PWD/../uri.txt" --no-daemon)
          wait

  android:
    runs-on: ubuntu-latest
    needs: core-and-interop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs missing platforms itself
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ukpro-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    needs: core-and-interop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, test, publish, installer
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ukpro-windows
          path: |
            dist/win-x64/UKPro.exe
            dist/UKPro-Setup-*.exe
